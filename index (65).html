<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 10th Anniversary Wifey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Marcellus&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#efe3c8;
    --bg-2:#e3cf9d;
    --maroon:#7a1330;
    --maroon-deep:#4a0d1e;
    --gold:#c9a227;
    --gold-light:#e7cd82;
    --ink:#2b1810;
    --cream:#fffaf0;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% -5%, #fff6df99, transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, #d8bd82);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .page{
    max-width:480px;
    margin:0 auto;
    padding:44px 22px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    font-family:Calibri, Carlito, 'Trebuchet MS', sans-serif;
    letter-spacing:.08em;
    font-size:13px;
    font-weight:600;
    color:var(--maroon-deep);
    opacity:1;
    margin-bottom:8px;
  }

  h1.headline{
    font-family:'Marcellus', serif;
    font-weight:400;
    font-size:clamp(28px, 8vw, 42px);
    line-height:1.35;
    letter-spacing:.02em;
    text-align:center;
    margin:0 0 34px;
    color:#0f5c3e;
    text-shadow:
      0 1px 0 rgba(255,255,255,.4),
      0 2px 10px rgba(201,162,39,.35);
  }

  /* ---- Portrait with black stroke + soft glow ---- */
  .portrait-wrap{
    position:relative;
    width:100%;
    max-width:340px;
    border-radius:18px;
    padding:6px;
  }
  .portrait-wrap::before{
    content:"";
    position:absolute;
    inset:-3px;
    border-radius:20px;
    background:#0b0705;
    box-shadow:
      0 0 0 2px #0b0705,
      0 0 18px 4px rgba(201,162,39,.6),
      0 0 40px 10px rgba(122,19,48,.35);
    z-index:0;
  }
  .portrait-wrap img{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    border-radius:14px;
    border:2px solid #0b0705;
  }

  /* ---- Caption box ---- */
  .caption-box{
    margin-top:22px;
    width:100%;
    background:var(--cream);
    border:1px solid #e3cfa0;
    border-radius:16px;
    padding:22px 24px;
    box-shadow:0 10px 26px -14px rgba(74,13,30,.35);
  }
  .caption-box p{
    margin:0;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-style:normal;
    font-size:20px;
    line-height:1.55;
    text-align:center;
    letter-spacing:.01em;
    color:var(--maroon-deep);
  }
  .caption-box p[contenteditable]:focus{outline:none;}
  .caption-hint{
    text-align:center;
    font-size:11px;
    color:#a68a4d;
    margin-top:10px;
    letter-spacing:.02em;
  }

  /* ---- Voice note widget ---- */
  .vn{
    margin-top:20px;
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--cream);
    border-radius:26px;
    padding:12px 18px;
    box-shadow:0 10px 26px -14px rgba(74,13,30,.35);
    border:1px solid #e3cfa0;
  }
  .vn-btn{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--gold), var(--maroon-deep));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px -3px rgba(74,13,30,.6);
  }
  .vn-btn svg{width:16px;height:16px;}
  .vn-wave{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    gap:3px;
    height:28px;
    overflow:hidden;
  }
  .vn-wave span{
    flex:1 1 0;
    min-width:2px;
    max-width:3px;
    border-radius:2px;
    background:#dcc48d;
    height:var(--h, 45%);
    transform-origin:center;
    animation:wave var(--dur, 1s) ease-in-out infinite;
    animation-delay:var(--delay, 0s);
    animation-play-state:paused;
  }
  .vn.playing .vn-wave span{
    background:var(--maroon);
    animation-play-state:running;
  }
  @keyframes wave{
    0%,100%{ transform:scaleY(.75); }
    50%{ transform:scaleY(1.3); }
  }
  .vn-label{
    flex:0 0 auto;
    font-size:12px;
    color:#a4894f;
    white-space:nowrap;
  }

  .footnote{
    margin-top:30px;
    text-align:center;
    font-size:11px;
    color:#a4894f;
    letter-spacing:.03em;
  }
</style>
</head>
<body>

<div class="page">
  <div class="eyebrow">10 saal ✦ ek kahani</div>
  <h1 class="headline">Happy 10th<br>Anniversary Wifey</h1>

  <div class="portrait-wrap">
    <img src="couple.jpg" alt="Anniversary portrait">
  </div>

  <div class="caption-box">
    <p contenteditable="true" spellcheck="false">Das saal, ek dil, aur tumhare saath likhi har kahani &mdash; happy anniversary, meri jaan. Tum jaisa saathi milna sabse bada vardaan hai. ❤️</p>
  </div>
  <div class="caption-hint">caption pe tap karke apne alfaaz likh sakte ho</div>

  <div class="vn" id="vnWidget">
    <button class="vn-btn" id="vnBtn" aria-label="Play voice note">
      <svg id="vnIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="vn-wave" id="vnWave"></div>
    <div class="vn-label">voice note</div>
    <audio id="vnAudio" src="voicenote.mp3" preload="none"></audio>
  </div>

  <div class="footnote">made with love, just for you</div>
</div>

<script>
  // build wave bars with slight randomized timing so it doesn't look mechanical
  const wave = document.getElementById('vnWave');
  const bars = 34;
  for(let i=0;i<bars;i++){
    const s = document.createElement('span');
    // random baseline height so it reads as a real waveform, not a flat line
    const h = 22 + Math.random()*68; // 22% - 90%
    s.style.setProperty('--h', h.toFixed(0)+'%');
    s.style.setProperty('--delay', (Math.random()*1.1).toFixed(2)+'s');
    s.style.setProperty('--dur', (0.7+Math.random()*0.7).toFixed(2)+'s');
    wave.appendChild(s);
  }

  const widget = document.getElementById('vnWidget');
  const btn = document.getElementById('vnBtn');
  const icon = document.getElementById('vnIcon');
  const audio = document.getElementById('vnAudio');
  const playPath = 'M8 5v14l11-7z';
  const pausePath = 'M6 5h4v14H6zM14 5h4v14h-4z';

  btn.addEventListener('click', () => {
    if(audio.paused){
      audio.play().catch(()=>{ /* file not found yet, still show animation */ });
      widget.classList.add('playing');
      icon.querySelector('path').setAttribute('d', pausePath);
    } else {
      audio.pause();
      widget.classList.remove('playing');
      icon.querySelector('path').setAttribute('d', playPath);
    }
  });

  audio.addEventListener('ended', () => {
    widget.classList.remove('playing');
    icon.querySelector('path').setAttribute('d', playPath);
  });
</script>

</body>
</html>
